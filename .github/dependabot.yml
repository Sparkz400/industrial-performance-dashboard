version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep declarations on the supported Node runtime major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 needs typescript-eslint support and compiler API migration.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      mui-major:
        patterns: ["@mui/*"]
        update-types: [major]
      storybook-vite-major:
        patterns: ["storybook", "@storybook/*", "vite", "@vitejs/*"]
        update-types: [major]
      lint-major:
        patterns:
          ["eslint*", "@eslint/*", "typescript-eslint", "@typescript-eslint/*"]
        update-types: [major]
      test-runner-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: [major]
      virtualization-major:
        patterns:
          [
            "react-window",
            "@types/react-window",
            "react-virtualized-auto-sizer",
          ]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/, /deploy/postgres, /deploy/proxy]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Node major changes require the support/qualification decision in TODO F09.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
