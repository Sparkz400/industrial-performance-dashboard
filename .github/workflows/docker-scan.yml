name: Container security report
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build current runtime image
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t performance-dashboard:scan .
          docker image inspect performance-dashboard:scan > image-identity.json
      - run: docker run --rm --entrypoint node performance-dashboard:scan ../scripts/test-runtime.mjs
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.76.1
          image-ref: performance-dashboard:scan
          scanners: vuln
          format: json
          output: trivy-results.json
          list-all-pkgs: "true"
      - name: Preserve the full scan for code scanning
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json
      - name: Scan the prepared database and TLS proxy images
        run: |
          docker build --pull -f deploy/postgres/Dockerfile -t performance-dashboard-postgres:scan .
          docker build --pull -f deploy/proxy/Dockerfile -t performance-dashboard-proxy:scan .
          trivy image --scanners vuln --format json --output postgres-scan.json performance-dashboard-postgres:scan
          trivy image --scanners vuln --format json --output proxy-scan.json performance-dashboard-proxy:scan
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 postgres-scan.json
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 proxy-scan.json
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
      - name: Block high and critical image vulnerabilities, including unfixed findings
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: container-security
          path: |
            image-identity.json
            trivy-results.json
            trivy-results.sarif
            postgres-scan.json
            proxy-scan.json
          retention-days: 14
